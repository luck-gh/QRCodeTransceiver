name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'packaging/**'
      - 'docs/**'
      - '.github/workflows/packages.yml'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python tests/smoke_ui.py
      - run: python build_exe.py --target windows-sender --arch x64 --output-dir dist/current
      - run: python build_exe.py --target windows-receiver --arch x64 --output-dir dist/current
      - run: python build_exe.py --bundle windows --output-dir dist/current
      - run: python tests/smoke_package.py dist/current/QRCodeTransceiver-Windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            dist/current/QRCodeTransceiver-Windows-x64.zip
            dist/current/QRCodeTransceiver-Windows-x64.zip.sha256
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    container: rockylinux:8
    steps:
      - name: Prepare checkout tools
        run: dnf install -y git libstdc++
      - uses: actions/checkout@v6
      - name: Build and test Linux x64 package
        run: bash packaging/build_linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64-glibc228
          path: |
            dist/current/QRCodeTransceiver-Linux-x64.zip
            dist/current/QRCodeTransceiver-Linux-x64.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist/release
          merge-multiple: true
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packages=(QRCodeTransceiver-Windows-x64.zip QRCodeTransceiver-Linux-x64.zip)
          (
            cd dist/release
            for package in "${packages[@]}"; do
              sha256sum --check "$package.sha256"
            done
          )
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import quote

          repo = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          tag = quote(os.environ['GITHUB_REF_NAME'], safe='')
          downloads = f'{repo}/releases/download/{tag}/'
          notes = Path('docs/RELEASE_NOTES.md').read_text(encoding='utf-8')
          notes = notes.replace(
              'https://github.com/luck-gh/QRCodeTransceiver/releases/latest/download/',
              downloads,
          ).replace(
              'https://github.com/luck-gh/QRCodeTransceiver/blob/master/',
              f'{repo}/blob/{tag}/',
          )
          links = re.findall(r'\[([^\[\]]+\.zip)\]\(' + re.escape(downloads) + r'\1\)', notes)
          archives = sorted(archive.name for archive in Path('dist/release').glob('*.zip'))
          if sorted(links) != archives:
              raise SystemExit(f'Release links do not match ZIP files: links={sorted(links)}, files={archives}')
          Path('dist/release-notes.md').write_text(notes, encoding='utf-8')
          PY
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME - Windows x64 / Linux x64" \
            --notes-file dist/release-notes.md "${packages[@]/#/dist/release/}"
